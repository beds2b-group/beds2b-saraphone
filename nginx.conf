server {
    listen 80;
    server_name _;

    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:3000 https://zammad.senator.tools" always;

    root /usr/share/nginx/html;
    index saraphone-embedded.html index.html;

    location / {
        try_files $uri $uri/ /saraphone-embedded.html;
    }

    location /api/infobip/ {
        rewrite ^/api/infobip/(.*)$ /$1 break;

        proxy_pass https://${INFOBIP_API_HOST};
        proxy_ssl_server_name on;
        proxy_set_header Host ${INFOBIP_API_HOST};
        proxy_set_header Authorization "App ${INFOBIP_API_KEY}";
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type "application/json";
    }

    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|mp3|wav|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
